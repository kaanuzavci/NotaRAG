[browser]
gatherUsageStats = false

[server]
enableStaticServing = true  # src/static → app/static (yazı tipleri)

[client]
toolbarMode = "minimal"

[theme]
# "Akademik baskı + fosforlu kalem": sıcak kâğıt zemin, mürekkep laciverdi, kanıt için sarı vurgu (v2 pastel denemesi geri alındı, 2026-10-05)
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#F7F4ED"
secondaryBackgroundColor = "#EFE9DC"
textColor = "#1E2433"
linkColor = "#1F3A5F"
borderColor = "#DCD3C1"
showWidgetBorder = true
baseRadius = "0.55rem"
# Yazı tipleri yerelden (src/static/fonts, latin + latin-ext: Türkçe harfler): internetsiz sunumda da aynı görünüm
# (eskiden Google Fonts adresinden yükleniyordu; indirme: 2026-10-06)
font = "Instrument Sans"
headingFont = "Fraunces"
codeFont = "JetBrains Mono"
headingFontWeights = [600, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#3A7BB8", "#CB5A44", "#8A72C2", "#3F9A6E", "#C98A28"]  # validate_palette.js: tüm kontroller geçti (kâğıt zemin)

[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/instrument-sans-400-latin-ext.woff2"
weight = 400
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

